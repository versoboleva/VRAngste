<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
      body {
        margin: 0px;
      }

      #player {
        position: relative;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        align-items: center;
        justify-content: center;
        display: flex;
        background-color: #323232;
        max-height: 100vh;
      }

      #player:before {
        content: "";
        display: block;
        padding-top: 66%;
      }

      #playButton {
        width: 15%;
        max-width: 200px;
        cursor: pointer;
      }

      #Video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      #fullscreenButton {
        position: absolute;
        top: 0;
        right: 0;
        width: 0;
        height: 0;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <div id="warning" hidden="true"></div>

      <div id="player"></div>
    </div>

    <script
      type="text/javascript"
      src="https://webrtc.github.io/adapter/adapter-latest.js"
    ></script>
    <script src="https://unpkg.com/event-target@latest/min.js"></script>
    <script src="https://unpkg.com/resize-observer-polyfill@1.5.0/dist/ResizeObserver.global.js"></script>
    <script type="module">
      import { getServerConfig, getRTCConfiguration } from "/js/config.js";
      import { VideoPlayer } from "/js/videoplayer.js";
      import { RenderStreaming } from "/module/renderstreaming.js";
      import { Signaling, WebSocketSignaling } from "/module/signaling.js";

      /** @type {Element} */
      let playButton;
      /** @type {RenderStreaming} */
      let renderstreaming;
      /** @type {boolean} */
      let useWebSocket;

      const supportsSetCodecPreferences =
        window.RTCRtpTransceiver &&
        "setCodecPreferences" in window.RTCRtpTransceiver.prototype;

      const playerDiv = document.getElementById("player");
      const videoPlayer = new VideoPlayer();

      setup();

      window.document.oncontextmenu = function () {
        return false; // cancel default menu
      };

      window.addEventListener(
        "resize",
        function () {
          videoPlayer.resizeVideo();
        },
        true,
      );

      window.addEventListener(
        "beforeunload",
        async () => {
          if (!renderstreaming) return;
          await renderstreaming.stop();
        },
        true,
      );

      async function setup() {
        const res = await getServerConfig();
        useWebSocket = res.useWebSocket;
        showWarningIfNeeded(res.startupMode);
        showCodecSelect();
        showPlayButton();
      }

      function showWarningIfNeeded(startupMode) {
        const warningDiv = document.getElementById("warning");
        if (startupMode == "private") {
          warningDiv.innerHTML =
            "<h4>Warning</h4> This sample is not working on Private Mode.";
          warningDiv.hidden = false;
        }
      }

      function showPlayButton() {
        if (!document.getElementById("playButton")) {
          const elementPlayButton = document.createElement("img");
          elementPlayButton.id = "playButton";
          elementPlayButton.src = "/images/Play.png";
          elementPlayButton.alt = "Start Streaming";
          playButton = document
            .getElementById("player")
            .appendChild(elementPlayButton);
          playButton.addEventListener("click", onClickPlayButton);
        }
      }

      function onClickPlayButton() {
        playButton.style.display = "none";

        videoPlayer.createPlayer(playerDiv, null);
        setupRenderStreaming();
      }

      async function setupRenderStreaming() {
        const signaling = useWebSocket
          ? new WebSocketSignaling()
          : new Signaling();
        const config = getRTCConfiguration();
        renderstreaming = new RenderStreaming(signaling, config);
        renderstreaming.onConnect = onConnect;
        renderstreaming.onDisconnect = onDisconnect;
        renderstreaming.onTrackEvent = (data) =>
          videoPlayer.addTrack(data.track);
        renderstreaming.onGotOffer = setCodecPreferences;

        await renderstreaming.start();
        await renderstreaming.createConnection();
      }

      function onConnect() {
        const channel = renderstreaming.createDataChannel("input");
        videoPlayer.setupInput(channel);
        showStatsMessage();
      }

      async function onDisconnect() {
        clearStatsMessage();

        await renderstreaming.stop();
        renderstreaming = null;
        videoPlayer.deletePlayer();

        showPlayButton();
      }

      function setCodecPreferences() {
        /** @type {RTCRtpCodecCapability[] | null} */
        let selectedCodecs = null;

        if (selectedCodecs == null) {
          return;
        }
        const transceivers = renderstreaming
          .getTransceivers()
          .filter((t) => t.receiver.track.kind == "video");
        if (transceivers && transceivers.length > 0) {
          transceivers.forEach((t) => t.setCodecPreferences(selectedCodecs));
        }
      }

      function showCodecSelect() {
        if (!supportsSetCodecPreferences) {
          return;
        }

        const codecs = RTCRtpSender.getCapabilities("video").codecs;
        codecs.forEach((codec) => {
          if (
            ["video/red", "video/ulpfec", "video/rtx"].includes(codec.mimeType)
          ) {
            return;
          }
          const option = document.createElement("option");
          option.value = (
            codec.mimeType +
            " " +
            (codec.sdpFmtpLine || "")
          ).trim();
          option.innerText = option.value;
        });
      }

      /** @type {RTCStatsReport} */
      /** @type {number} */
      let intervalId;

      function showStatsMessage() {
        intervalId = setInterval(async () => {
          if (renderstreaming == null) {
            return;
          }

          const stats = await renderstreaming.getStats();
          if (stats == null) {
            return;
          }
        }, 1000);
      }

      function clearStatsMessage() {
        if (intervalId) {
          clearInterval(intervalId);
        }
        intervalId = null;
      }
    </script>
  </body>
</html>
